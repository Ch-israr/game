# Render Blueprint for Mini Golf 3D (Next.js 16, standalone output).
# Apply from the Render dashboard (New + -> Blueprint) or via the
# "New Web Service" flow — Render picks up this file automatically.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: minigolf-3d
    # Oregon: same region as TwitterDown and ClearMark, which both serve
    # fine.
    region: oregon
    plan: free
    # Docker, not native Node: the native-Node service built cleanly and
    # reported Live but answered HTTP 502 on every request in two regions
    # (Singapore, then Oregon), with clean logs and a listening server.
    # TwitterDown and ClearMark both run as Docker on this account and
    # serve fine, so this service uses the Dockerfile at the repo root.
    env: docker
    dockerfilePath: ./Dockerfile
    # The Next.js standalone server binds to Render's $PORT automatically
    # — do not set PORT here. NOTE: do NOT set NODE_ENV in envVars —
    # Next sets it to production itself.
    healthCheckPath: /
    envVars:
      # SQLite file committed in the repo (db/custom.db). Scores reset on
      # each fresh deploy since Render's filesystem is ephemeral on free.
      - key: DATABASE_URL
        value: file:./db/custom.db
